name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build, verify, attest, and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          grep -F "version: ${version}" CITATION.cff
      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
      - name: Build clean distributions
        run: |
          python -m pip install "build>=1.2.2,<2"
          python -m build --outdir release-assets
      - name: Verify wheel in a clean environment
        shell: bash
        run: python scripts/verify_clean_wheel.py release-assets/*.whl
      - name: Build deterministic release metadata
        shell: bash
        run: |
          python scripts/build_release_assets.py \
            --dist-dir release-assets \
            --evidence evidence/arl-smoke-v1
      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --title "Agent Reliability Lab ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_TEMPLATE.md

# PyPI publication is intentionally absent. Add it only after trusted publishing is
# configured and reviewed in the protected release environment.
