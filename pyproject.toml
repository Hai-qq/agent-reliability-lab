[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-lab"
version = "0.4.0"
description = "Fault-injection benchmark and reliability runtime for stateful tool-using agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hai-qq" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
  "ai-agents",
  "benchmark",
  "fault-injection",
  "reliability",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Hai-qq/agent-reliability-lab"
Documentation = "https://hai-qq.github.io/agent-reliability-lab/"
Issues = "https://github.com/Hai-qq/agent-reliability-lab/issues"
Repository = "https://github.com/Hai-qq/agent-reliability-lab"

[project.scripts]
arl = "arl.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.15,<3",
  "ruff>=0.11,<1",
]
docs = [
  "mkdocs>=1.6,<2",
]
validation = [
  "jsonschema>=4.23,<5",
]
security = [
  "pip-audit>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
arl = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "arl.analysis.*",
  "arl.cli",
  "arl.evidence.*",
  "arl.studies.*",
]
strict = true

[tool.coverage.run]
branch = true
source = ["arl"]

[tool.coverage.report]
show_missing = true
skip_covered = true
